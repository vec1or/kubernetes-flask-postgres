apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: devops-demo
data:
  APP_ENV: development
  PORT: "5000"
  POSTGRES_HOST: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: devops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: demo-flask:k3s-v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: APP_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: PORT
            - name: POSTGRES_USER
              value: devops
            - name: POSTGRES_DB
              value: demoapp
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: devops-demo
spec:
  type: ClusterIP
  selector:
    app: flask
  ports:
    - port: 5000
      targetPort: 5000
